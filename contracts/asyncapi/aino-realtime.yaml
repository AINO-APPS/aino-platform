asyncapi: 2.6.0
info:
  title: AINO realtime baseline
  version: 1.0.0
  description: >-
    Baseline derived from server/utils/ws.ts and server/utils/wsHandlers. Frames are
    JSON envelopes with type and optional data. Unknown types and malformed JSON are ignored.
servers:
  production:
    url: aino.org.in/ws
    protocol: wss
    description: Native ws endpoint. The server caps frames at 64 KiB and 60 frames/second/connection.
    security:
      - cookieToken: []
      - queryToken: []
      - subprotocolToken: []
channels:
  /ws:
    description: >-
      Authentication precedence is token cookie, token query parameter, then the first
      Sec-WebSocket-Protocol value. JWT failure/missing/revoked/expired tokens close with 4001;
      unavailable tenants close with 4003; excess per-user connections close with 4029.
    publish:
      operationId: receiveClientFrame
      message:
        oneOf:
          - $ref: '#/components/messages/Ping'
          - $ref: '#/components/messages/ChatMessageCommand'
          - $ref: '#/components/messages/CallInitiateCommand'
          - $ref: '#/components/messages/CallAcceptCommand'
          - $ref: '#/components/messages/CallRejectCommand'
          - $ref: '#/components/messages/CallEndCommand'
          - $ref: '#/components/messages/CallCancelCommand'
          - $ref: '#/components/messages/CallRingingCommand'
          - $ref: '#/components/messages/MeetingReactionCommand'
    subscribe:
      operationId: sendServerFrame
      message:
        oneOf:
          - $ref: '#/components/messages/Pong'
          - $ref: '#/components/messages/ChatMessageEvent'
          - $ref: '#/components/messages/ChatMessageError'
          - $ref: '#/components/messages/UserProfileUpdatedEvent'
          - $ref: '#/components/messages/CallIncomingEvent'
          - $ref: '#/components/messages/CallAcceptedEvent'
          - $ref: '#/components/messages/CallRejectedEvent'
          - $ref: '#/components/messages/CallEndedEvent'
          - $ref: '#/components/messages/CallHandledElsewhereEvent'
          - $ref: '#/components/messages/CallRingingEvent'
          - $ref: '#/components/messages/ChatClearedEvent'
          - $ref: '#/components/messages/ChatConvDeletedEvent'
          - $ref: '#/components/messages/ChatGroupJoinRequestEvent'
          - $ref: '#/components/messages/GroupCallUpdatedEvent'
          - $ref: '#/components/messages/MeetingReactionEvent'
          - $ref: '#/components/messages/NotificationEvent'
          - $ref: '#/components/messages/NotificationsChangedEvent'
          - $ref: '#/components/messages/TaskAssignedEvent'
          - $ref: '#/components/messages/TaskUpdatedEvent'
          - $ref: '#/components/messages/AttendanceUpdateEvent'
          - $ref: '#/components/messages/TeamAttendanceUpdateEvent'
          - $ref: '#/components/messages/LeaveUpdateEvent'
          - $ref: '#/components/messages/LeavePolicyChangedEvent'
          - $ref: '#/components/messages/ApprovalUpdateEvent'
components:
  securitySchemes:
    cookieToken:
      type: apiKey
      in: cookie
      name: token
    queryToken:
      type: apiKey
      in: query
      name: token
    subprotocolToken:
      type: apiKey
      in: header
      name: Sec-WebSocket-Protocol
  schemas:
    PositiveId:
      type: integer
      minimum: 1
    ClientMsgId:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        Optional idempotency key. General mutable-handler cache key is tenant/user/type/clientMsgId,
        in-process, 5 minute TTL. Call action keys additionally isolate by callId and action.
        chat_message also has authoritative database deduplication and re-echoes a duplicate to sender only.
    Envelope:
      type: object
      required: [type]
      properties:
        type: { type: string, minLength: 1 }
        data: { type: object }
      additionalProperties: true
    CallActionData:
      type: object
      required: [callId, conversationId]
      properties:
        callId: { $ref: '#/components/schemas/PositiveId' }
        conversationId: { $ref: '#/components/schemas/PositiveId' }
        clientMsgId: { $ref: '#/components/schemas/ClientMsgId' }
      additionalProperties: true
    NotificationLink:
      type: [string, 'null']
      pattern: '^/(?!/)'
      description: >-
        Relative web path the client opens when the notification is tapped; never an absolute URL.
        Formats - task assigned / task comment mention: /tasks?task=<taskId>; note mention:
        /notes?pageId=<pageId>; request awaiting the recipient's approval (leave, leave withdrawal,
        manual entry, overtime): /manager?tab=approvals&request=<approvalRequestId> (id as used by
        GET /api/manager/approvals and POST /api/manager/approvals/:id/approve) or
        /manager?tab=approvals when the id is unknown (e.g. multi-day leave batches); leave
        approved/rejected/revoked: /attendance#leaves; manual entry / overtime approved/rejected:
        /attendance#manual-entry; agile_request / agile_grant: /admin?tab=agile;
        platform_access_request: /admin?tab=platform-access. null when there is no destination.
    ApprovalRequestType:
      type: string
      description: approval_requests.type (leave, leave_withdraw, manual_entry, overtime) or "bulk" after a bulk decision.
  messages:
    Ping:
      payload:
        type: object
        required: [type]
        properties: { type: { const: ping } }
        additionalProperties: true
    Pong:
      payload:
        type: object
        required: [type]
        properties: { type: { const: pong } }
        additionalProperties: false
    ChatMessageCommand:
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: chat_message }
              data:
                type: object
                required: [conversationId, content]
                properties:
                  conversationId: { $ref: '#/components/schemas/PositiveId' }
                  content: { type: string, minLength: 1, maxLength: 5000 }
                  replyToId: { $ref: '#/components/schemas/PositiveId' }
                  formatType: { type: string, maxLength: 16, description: Unknown values are normalized to text. }
                  clientMsgId: { $ref: '#/components/schemas/ClientMsgId' }
                  mentions: { type: array, items: { $ref: '#/components/schemas/PositiveId' } }
                  linkPreview: { type: object }
                additionalProperties: true
    ChatMessageEvent:
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties: { type: { const: chat_message }, data: { type: object } }
    ChatMessageError:
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: chat_message_error }
              data:
                type: object
                required: [reason]
                properties: { clientMsgId: { type: [string, 'null'] }, reason: { type: string } }
    UserProfileUpdatedEvent:
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: user_profile_updated }
              data:
                type: object
                required: [userId, avatar]
                properties:
                  userId: { $ref: '#/components/schemas/PositiveId' }
                  avatar: { type: [string, 'null'] }
    CallInitiateCommand:
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: call_initiate }
              data:
                type: object
                required: [conversationId, callType]
                properties:
                  conversationId: { $ref: '#/components/schemas/PositiveId' }
                  callType: { enum: [voice, video] }
                  clientMsgId: { $ref: '#/components/schemas/ClientMsgId' }
    CallAcceptCommand:
      payload: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { type: { const: call_accept }, data: { $ref: '#/components/schemas/CallActionData' } } }] }
    CallRejectCommand:
      payload: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { type: { const: call_reject }, data: { $ref: '#/components/schemas/CallActionData' } } }] }
    CallEndCommand:
      payload: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { type: { const: call_end }, data: { $ref: '#/components/schemas/CallActionData' } } }] }
    CallCancelCommand:
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: call_cancel }
              data:
                type: object
                required: [conversationId]
                properties:
                  conversationId: { $ref: '#/components/schemas/PositiveId' }
                  clientMsgId: { $ref: '#/components/schemas/ClientMsgId' }
    CallRingingCommand:
      summary: >-
        Sent by the CALLEE device once it starts ringing (HTTP twin for a device woken by FCM without a socket:
        POST /api/chat/calls/:callId/ringing). The sender must be a participant and not the caller, and the
        call must still be ringing. Idempotent per (callId, sender); repeated acks are harmless.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: call_ringing }
              data:
                type: object
                required: [callId, conversationId]
                properties:
                  callId: { $ref: '#/components/schemas/PositiveId' }
                  conversationId: { $ref: '#/components/schemas/PositiveId' }
                  clientMsgId: { $ref: '#/components/schemas/ClientMsgId' }
    CallIncomingEvent:
      payload: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { type: { const: call_incoming }, data: { type: object, required: [callId, conversationId, callerId, callType], properties: { callId: { $ref: '#/components/schemas/PositiveId' }, conversationId: { $ref: '#/components/schemas/PositiveId' }, callerId: { $ref: '#/components/schemas/PositiveId' }, callerName: { type: string }, callerAvatar: { type: [string, 'null'] }, callType: { enum: [voice, video] }, isGroup: { type: boolean }, groupName: { type: [string, 'null'] }, groupAvatar: { type: [string, 'null'] } } } } }] }
    CallAcceptedEvent:
      payload: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { type: { const: call_accepted }, data: { type: object } } }] }
    CallRejectedEvent:
      payload: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { type: { const: call_rejected }, data: { type: object } } }] }
    CallEndedEvent:
      payload: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { type: { const: call_ended }, data: { type: object, required: [callId, conversationId] } } }] }
    CallHandledElsewhereEvent:
      payload: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { type: { const: call_handled_elsewhere }, data: { type: object, required: [callId, conversationId, action], properties: { action: { enum: [accepted, rejected] } } } } }] }
    CallRingingEvent:
      summary: Delivered to every session of the CALLER when a callee device reports it is ringing ("Calling…" → "Ringing…").
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: call_ringing }
              data:
                type: object
                required: [callId, conversationId, userId]
                properties:
                  callId: { $ref: '#/components/schemas/PositiveId' }
                  conversationId: { $ref: '#/components/schemas/PositiveId' }
                  userId: { $ref: '#/components/schemas/PositiveId' }
    ChatClearedEvent:
      summary: >-
        Per-user "Clear chat" (DELETE /api/chat/conversations/:id/messages), sent ONLY to the requester's own
        sessions so their other devices drop the thread. Other participants are not notified and keep their copy.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: chat_cleared }
              data: { type: object, required: [conversationId], properties: { conversationId: { $ref: '#/components/schemas/PositiveId' } } }
    ChatConvDeletedEvent:
      summary: >-
        Per-user "Delete chat" (DELETE /api/chat/conversations/:id), sent ONLY to the requester's own sessions so
        their other devices remove it from the list. It reappears there when a newer message arrives.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: chat_conv_deleted }
              data: { type: object, required: [conversationId], properties: { conversationId: { $ref: '#/components/schemas/PositiveId' } } }
    ChatGroupJoinRequestEvent:
      summary: >-
        Sent to the group's owner and admins when someone asks to join through a group link that requires
        approval (POST /api/chat/invite/:token/join). Review via /api/chat/conversations/:id/join-requests.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: chat_group_join_request }
              data:
                type: object
                required: [conversationId, userId]
                properties:
                  conversationId: { $ref: '#/components/schemas/PositiveId' }
                  userId: { $ref: '#/components/schemas/PositiveId' }
                  userName: { type: [string, 'null'] }
    GroupCallUpdatedEvent:
      summary: >-
        Sent to every member of a group after someone joins or leaves its group call (huddle), and when it ends,
        so chat screens can show or hide a "Join call" banner. Not sent for scheduled meetings.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: group_call_updated }
              data:
                type: object
                required: [conversationId, meetingId, meetingCode, active, participantCount]
                properties:
                  conversationId: { $ref: '#/components/schemas/PositiveId' }
                  meetingId: { $ref: '#/components/schemas/PositiveId' }
                  meetingCode: { type: string }
                  active: { type: boolean }
                  participantCount: { type: integer, minimum: 0 }
    MeetingReactionCommand:
      summary: A joined participant sends a short-lived emoji reaction (max 16 UTF-16 units) to everyone in the call.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: meeting_reaction }
              data:
                type: object
                required: [meetingId, emoji]
                properties:
                  meetingId: { $ref: '#/components/schemas/PositiveId' }
                  emoji: { type: string, minLength: 1, maxLength: 16 }
    MeetingReactionEvent:
      summary: Relayed to every joined participant (including the sender) for a meeting_reaction command.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: meeting_reaction }
              data:
                type: object
                required: [meetingId, userId, emoji]
                properties:
                  meetingId: { $ref: '#/components/schemas/PositiveId' }
                  userId: { $ref: '#/components/schemas/PositiveId' }
                  name: { type: [string, 'null'] }
                  emoji: { type: string }
    NotificationEvent:
      summary: In-app notification created (also delivered as an FCM general alert with link/linkTaskId).
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: notification }
              data:
                type: object
                required: [id, type, title, body, link_task_id, link, created_at, is_read]
                properties:
                  id: { $ref: '#/components/schemas/PositiveId' }
                  type: { type: string }
                  title: { type: string }
                  body: { type: [string, 'null'] }
                  link_task_id: { type: [integer, 'null'] }
                  link: { $ref: '#/components/schemas/NotificationLink' }
                  created_at: { type: string, format: date-time }
                  is_read: { const: false }
    NotificationsChangedEvent:
      summary: Sent to the acting user's own connections after mark-read, read-all or delete so other devices resync.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: notifications_changed }
              data:
                type: object
                required: [action]
                properties:
                  action: { enum: [read, read_all, deleted] }
                  id: { $ref: '#/components/schemas/PositiveId' }
    TaskAssignedEvent:
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: task_assigned }
              data:
                type: object
                required: [taskId, title]
                properties: { taskId: { $ref: '#/components/schemas/PositiveId' }, title: { type: string } }
    TaskUpdatedEvent:
      summary: >-
        Sent (deduped) to the assignee, creator and acting user on task update, status change, delete and new
        comment. On reassignment the new assignee gets task_assigned instead; the previous assignee gets task_updated.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: task_updated }
              data:
                type: object
                required: [taskId, action]
                properties:
                  taskId: { $ref: '#/components/schemas/PositiveId' }
                  action: { enum: [updated, status, deleted, comment] }
    AttendanceUpdateEvent:
      summary: Sent to the acting user's own connections when their attendance changes.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: attendance_update }
              data:
                type: object
                required: [action]
                properties:
                  action: { enum: [clock_in, clock_out, break_start, break_end, manual_entry, entry_deleted] }
    TeamAttendanceUpdateEvent:
      summary: >-
        Sent to the acting user's direct manager and resolved approver (deduped, same tenant, never the actor)
        alongside attendance_update.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: team_attendance_update }
              data:
                type: object
                required: [userId, action]
                properties:
                  userId: { $ref: '#/components/schemas/PositiveId' }
                  action: { enum: [clock_in, clock_out, break_start, break_end, manual_entry, entry_deleted] }
    LeaveUpdateEvent:
      summary: >-
        Sent to the leave owner: pending (apply), cancelled (delete / withdraw of a pending leave),
        withdraw_pending (withdrawal of an approved leave requested), approved / rejected / revoked (decisions).
        id is the leave id when a single leave is affected.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: leave_update }
              data:
                type: object
                required: [status]
                properties:
                  id: { $ref: '#/components/schemas/PositiveId' }
                  status: { enum: [pending, cancelled, withdraw_pending, approved, rejected, revoked] }
    LeavePolicyChangedEvent:
      summary: Tenant-wide broadcast for policies/holidays mutations; balances edits go only to the affected user.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: leave_policy_changed }
              data:
                type: object
                required: [scope]
                properties:
                  scope: { enum: [holidays, policies, balances] }
    ApprovalUpdateEvent:
      summary: >-
        Sent to the approver when a request awaits them (status pending), to the requester when a manual entry /
        overtime request is decided, and to the acting approver's own devices after any decision (also
        cancelled when a requester cancels a pending leave). id is the approval request id when known.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: approval_update }
              data:
                type: object
                required: [status]
                properties:
                  id: { $ref: '#/components/schemas/PositiveId' }
                  type: { $ref: '#/components/schemas/ApprovalRequestType' }
                  status: { enum: [pending, approved, rejected, revoked, cancelled] }
