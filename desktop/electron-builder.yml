# REBRAND (WorkPulse -> AINO).
#
# `appId` is deliberately NOT renamed. On Windows it seeds the NSIS product
# GUID: changing it makes the installer treat AINO as a DIFFERENT product, so it
# installs side-by-side instead of upgrading, strands the old install, and
# breaks the auto-update chain for everyone already on WorkPulse. Users never
# see it.
appId: com.workpulse.desktop
# `productName` drives the window/installer title and, via `${productName}`
# in nsis.artifactName below, the installer FILENAME. It also seeds Electron's
# userData directory name -- see desktop/appIdentity.ts, which copies the legacy
# %APPDATA%\WorkPulse profile forward so the rename does not log users out.
productName: AINO
copyright: Copyright © 2026 AINO
protocols:
  - name: AINO links
    schemes:
      - workpulse

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - application.js
  - config.js
  - deepLinks.js
  - ipcSecurity.js
  - preloadListeners.js
  - locationUtils.js
  - lifecycle.js
  - navigationSecurity.js
  - windows.js
  # Sets app.name and migrates the legacy %APPDATA%\WorkPulse profile. main.js
  # requires it, so omitting it here crashes the PACKAGED app on launch with
  # "Cannot find module ./appIdentity" (dev runs fine -- this list only
  # applies to what gets bundled into the asar).
  - appIdentity.js
  - preload.js
  - tray.js
  - updater.js
  - callPipWindow.js
  - biometric.js
  - ipc-contract.js
  - permissions.js
  - screenCapture.js
  - locationIpc.js
  - protocol.js
  - protocolUtils.js
  - windowState.js
  - icons/**/*
  - package.json
  - google-api-key.txt

extraResources:
  - from: ../client/dist
    to: client/dist
    filter:
      - "**/*"
  # NOTE: we deliberately do NOT duplicate google-api-key.txt into
  # extraResources. The file is already packaged inside the asar via the
  # `files:` array above, and Electron's asar shim lets main.js read it
  # via `path.join(__dirname, 'google-api-key.txt')`. Adding an explicit
  # `from: google-api-key.txt` entry here would make local dev builds
  # (and CI builds without the GOOGLE_API_KEY secret) fail with
  # "ENOENT: google-api-key.txt" because electron-builder treats missing
  # extraResources source files as a hard error.

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icons/icon.ico
  publisherName: AINO
  # Left false deliberately, even though the release workflow can now sign.
  # electron-updater checks that an incoming update's Authenticode publisher
  # matches the installed app's. Every build published so far is unsigned, so
  # enabling this now would make already-installed clients REJECT the first
  # signed update and strand themselves. Flip it to true only in the release
  # AFTER the first signed build has shipped and been adopted.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AINO
  artifactName: "${productName}-Setup-${version}.${ext}"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: icons/icon.png
  category: public.app-category.business
  # Required for Developer ID distribution: Apple will not notarize a build
  # without the hardened runtime. Harmless on an unsigned build.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # `notarize` is deliberately left at its default rather than forced to true.
  # electron-builder notarizes automatically once the build is signed and
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are present; forcing
  # it true would hard-fail every unsigned build instead of skipping.

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
    - target: deb
  icon: icons
  category: Office

publish:
  provider: github
  owner: AINO-APPS
  repo: aino-platform
  releaseType: release
