name: Desktop Release

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v3.0.23)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: desktop-release-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate tag matches package.json version
        id: check
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z"
            exit 1
          fi
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reset the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/releases/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release v${VERSION} is already published; immutable releases cannot be overwritten."
            exit 1
          fi
          id=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.draft == true and (.name == \"v${VERSION}\" or .name == \"${VERSION}\")) | .id" \
            | head -1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="v${VERSION}" -f name="v${VERSION}" -F draft=true \
              --jq '.id')
          else
            for asset_id in $(gh api --paginate \
              "repos/${{ github.repository }}/releases/${id}/assets" --jq '.[].id'); do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${asset_id}"
            done
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "Prepared draft release id=${id}"

  build:
    needs: [validate, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json

      - name: Install and build Electron renderer
        working-directory: client
        env:
          VITE_WS_URL: wss://www.aino.org.in/ws
          VITE_ELECTRON: "true"
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Compile desktop TypeScript (main process)
        # The compiled *.js (main.js, appIdentity.js, preload.js, tray.js,
        # updater.js, callPipWindow.js) are gitignored and therefore NOT in the checkout.
        # electron-builder's `files:` array references them directly, so without
        # this step electron-builder packages an app with no entry point and
        # produces no installer — which then makes the upload-artifact step fail
        # with "No files were found with the provided path".
        working-directory: desktop
        run: npm run build:main

      - name: Write Google API key for geolocation
        # NOTE: do NOT use `env.GOOGLE_API_KEY` here — step-level `if:` does NOT
        # see step-level `env:`, it only sees job/workflow env. Reference the
        # secret directly instead. (We also can't reference `secrets.*` in `if`
        # for some hosted runners — so the bash guard inside also protects us.)
        shell: bash
        working-directory: desktop
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "${GOOGLE_API_KEY}" ]; then
            echo "::warning::GOOGLE_API_KEY secret is empty — packaged build will fall back to coarse network geolocation"
            exit 0
          fi
          # Use printf (NOT echo) so we don't append a trailing \n (or \r\n on
          # Windows runners). Chromium's --google-api-key switch is whitespace-
          # sensitive and a stray newline can silently invalidate the key.
          printf '%s' "${GOOGLE_API_KEY}" > google-api-key.txt
          BYTES=$(wc -c < google-api-key.txt | tr -d ' ')
          echo "Wrote google-api-key.txt (${BYTES} bytes)"
          # Sanity check: a typical Google API key is 39 chars.
          if [ "${BYTES}" -lt 30 ] || [ "${BYTES}" -gt 80 ]; then
            echo "::warning::google-api-key.txt is ${BYTES} bytes — does not look like a valid Google API key"
          fi

      # ──────────────────────────────────────────────────────────────────────
      # Cache the electron binary downloads (and app-builder helper binaries)
      # so that flaky 502s from github.com/electron/electron/releases/download
      # don't fail the build on every retry. The cache key includes the
      # electron version so a version bump invalidates the cache automatically.
      # ──────────────────────────────────────────────────────────────────────
      - name: Read electron version
        id: electron_ver
        shell: bash
        working-directory: desktop
        run: |
          EV=$(node -p "require('electron/package.json').version")
          echo "version=$EV" >> "$GITHUB_OUTPUT"
          echo "Electron version: $EV"

      - name: Cache electron binaries (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ steps.electron_ver.outputs.version }}-v2
          restore-keys: |
            ${{ runner.os }}-electron-${{ steps.electron_ver.outputs.version }}-
            ${{ runner.os }}-electron-

      - name: Cache electron binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ steps.electron_ver.outputs.version }}-v2
          restore-keys: |
            ${{ runner.os }}-electron-${{ steps.electron_ver.outputs.version }}-
            ${{ runner.os }}-electron-

      # IMPORTANT: do NOT pass GH_TOKEN to this step — we don't want electron-builder
      # to publish directly. When it does, parallel matrix jobs each create their OWN
      # duplicate draft release (named "1.4.x" without the "v" prefix) that they
      # can't find via /releases/tags/{tag}, scattering assets across 3-4 duplicate
      # drafts. Instead we collect artifacts and upload them all once from the single
      # release-notes job below, against a release WE control.
      #
      # The retry loop guards against transient 502s from
      # github.com/electron/electron/releases/download/... which periodically
      # bombs out and kills the macOS leg of the build.
      # Code signing. electron-builder reads CSC_LINK / CSC_KEY_PASSWORD (and the
      # notarization variables on macOS) straight from the environment, so the
      # certificates are never written to disk here.
      #
      # Signing degrades gracefully: when the secrets are absent the build still
      # produces installers, just unsigned. That keeps the pipeline usable before
      # certificates are purchased, at the cost of a Windows SmartScreen warning
      # and macOS Gatekeeper blocking the app until it is notarized.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY must be explicitly false when unsigned,
      # otherwise electron-builder searches the macOS runner's keychain, finds
      # nothing and fails the build instead of falling back to unsigned.
      # Export the certificate into GITHUB_ENV only when one actually exists.
      #
      # CSC_LINK must be absent, not empty, for an unsigned build. electron-builder
      # treats a defined-but-empty CSC_LINK as a certificate *path* and resolves it
      # relative to the app directory, then aborts with the misleading
      # "<repo>/desktop not a file" — it never mentions signing or the certificate.
      # Setting these with `env:` and a `|| ''` fallback therefore breaks every
      # unsigned macOS build.
      - name: Determine signing availability
        id: signing
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          case "${{ matrix.os }}" in
            windows-latest) link="$WIN_CSC_LINK"; password="$WIN_CSC_KEY_PASSWORD" ;;
            macos-latest)   link="$MAC_CSC_LINK"; password="$MAC_CSC_KEY_PASSWORD" ;;
            *)              link=""; password="" ;;
          esac

          if [ -n "$link" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "CSC_LINK=$link" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "Code signing enabled for ${{ matrix.os }}."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            # Explicitly false, otherwise electron-builder searches the macOS
            # runner keychain, finds nothing, and fails instead of falling back.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::No signing certificate for ${{ matrix.os }} — producing an UNSIGNED build."
          fi

      - name: Build Electron app (with retries)
        shell: bash
        working-directory: desktop
        env:
          # Quiet down electron-builder native dependency rebuild noise on CI
          USE_HARD_LINKS: "false"
          # CSC_LINK, CSC_KEY_PASSWORD and CSC_IDENTITY_AUTO_DISCOVERY come from
          # GITHUB_ENV via the step above, which sets them only when a certificate
          # exists. Do not reintroduce them here with a `|| ''` fallback: an empty
          # CSC_LINK is read as a certificate path and breaks unsigned builds.
          #
          # Notarization. electron-builder only notarizes when all three are set
          # AND the app is signed; an unsigned macOS build skips it.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MAX_ATTEMPTS=4
          ATTEMPT=1
          until [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; do
            echo "── electron-builder attempt ${ATTEMPT}/${MAX_ATTEMPTS} ──"
            # Capture the real exit code. Do NOT wrap this in `if`: a failed `if`
            # condition with no `else` makes the compound statement return 0, so
            # `$?` afterwards is 0 and every failure gets silently swallowed —
            # which is why the job used to limp on to the upload step and fail
            # there with a confusing "No files were found" error instead of
            # surfacing the actual electron-builder error here.
            EXIT=0
            npx electron-builder ${{ matrix.args }} --publish never || EXIT=$?
            if [ "$EXIT" -eq 0 ]; then
              echo "Build succeeded on attempt ${ATTEMPT}"
              exit 0
            fi
            echo "::warning::electron-builder failed on attempt ${ATTEMPT} (exit ${EXIT})"
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::electron-builder failed after ${MAX_ATTEMPTS} attempts"
              exit "$EXIT"
            fi
            SLEEP=$(( ATTEMPT * 30 ))
            echo "Sleeping ${SLEEP}s before retry…"
            sleep "$SLEEP"
            ATTEMPT=$(( ATTEMPT + 1 ))
          done

      - name: Generate checksums
        shell: bash
        working-directory: desktop/dist
        run: |
          echo "## Checksums (SHA-256)" > checksums.txt
          for f in *.exe *.dmg *.AppImage *.deb *.zip *.blockmap latest*.yml; do
            [ -f "$f" ] && sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Stage installers for upload
        shell: bash
        working-directory: desktop/dist
        run: |
          # Collect only the files that need to be on the GitHub release. We deliberately
          # exclude the unpacked app bundles (linux-unpacked/, win-unpacked/, mac/, etc.)
          # which are huge and not needed by electron-updater.
          mkdir -p ../../release-assets/${{ matrix.os }}
          shopt -s nullglob
          for f in *.exe *.exe.blockmap \
                   *.dmg *.dmg.blockmap *.zip *.zip.blockmap \
                   *.AppImage *.AppImage.blockmap *.deb \
                   latest.yml latest-mac.yml latest-linux.yml; do
            if [ -f "$f" ]; then
              cp "$f" "../../release-assets/${{ matrix.os }}/"
              echo "Staged: $f"
            fi
          done
          echo "---"
          echo "Total staged files:"
          ls -la "../../release-assets/${{ matrix.os }}/"

      - name: Upload installers and checksums to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          cp desktop/dist/checksums.txt "release-assets/${{ matrix.os }}/checksums-${{ matrix.os }}.txt"
          test -n "$(find release-assets/${{ matrix.os }} -maxdepth 1 -type f -print -quit)"
          for file in release-assets/${{ matrix.os }}/*; do
            name=$(basename "$file")
            encoded_name=$(jq -rn --arg value "$name" '$value|@uri')
            case "$name" in
              *.yml|*.yaml) content_type="text/yaml" ;;
              *.exe) content_type="application/vnd.microsoft.portable-executable" ;;
              *.dmg) content_type="application/x-apple-diskimage" ;;
              *.zip|*.blockmap) content_type="application/zip" ;;
              *.AppImage) content_type="application/x-executable" ;;
              *.deb) content_type="application/vnd.debian.binary-package" ;;
              *) content_type="application/octet-stream" ;;
            esac
            code=$(curl --silent --show-error --output upload-response.json --write-out '%{http_code}' \
              -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: ${content_type}" --data-binary "@${file}" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${encoded_name}")
            if [ "$code" != "201" ]; then
              cat upload-response.json
              echo "::error::Failed to upload ${name} to draft release (HTTP ${code})"
              exit 1
            fi
          done

  release-notes:
    # Do not publish the GitHub Release until its immutable production R2 files
    # have been uploaded and verified. The stable latest.json pointer is promoted
    # only after the draft itself is successfully published below.
    needs: [validate, prepare-release, build, publish-r2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download checksums from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p checksums
          gh api --paginate "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name | startswith("checksums-")) | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r id name; do
                gh api -H 'Accept: application/octet-stream' \
                  "repos/${{ github.repository }}/releases/assets/${id}" > "checksums/${name}"
              done
          test "$(find checksums -type f | wc -l)" -eq 3

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')

          NOTES="## WorkPulse Desktop v${VERSION}\n\n"

          if [ -n "$PREV_TAG" ]; then
            NOTES+="### Changes since ${PREV_TAG}\n\n"
            # Group commits by type
            FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^feat" --no-merges 2>/dev/null || true)
            FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^fix" --no-merges 2>/dev/null || true)
            OTHER=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --invert-grep --grep="^feat" --grep="^fix" --no-merges 2>/dev/null | head -20 || true)

            if [ -n "$FEATURES" ]; then
              NOTES+="### ✨ Features\n${FEATURES}\n\n"
            fi
            if [ -n "$FIXES" ]; then
              NOTES+="### 🐛 Bug Fixes\n${FIXES}\n\n"
            fi
            if [ -n "$OTHER" ]; then
              NOTES+="### 📝 Other Changes\n${OTHER}\n\n"
            fi
          fi

          # Append checksums
          NOTES+="### 🔒 Checksums (SHA-256)\n\`\`\`\n"
          for f in checksums/checksums-*.txt; do
            if [ -f "$f" ]; then
              NOTES+="$(cat "$f")\n"
            fi
          done
          NOTES+="\`\`\`\n"

          # Write to file for the GitHub release
          echo -e "$NOTES" > release-notes.md
          cat release-notes.md

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          if gh api -X PATCH \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -F body=@release-notes.md; then
            echo "Updated release notes for v${VERSION}"
          else
            echo "::warning::Failed to update release notes for v${VERSION} (id=${RELEASE_ID}); continuing"
          fi

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          # Use the RELEASE_ID we already captured when we created/found the
          # draft. This is critical because GitHub returns tag_name="untagged-XXX"
          # for draft releases — the real tag is only attached at publish time.
          # That makes both `gh release view v${VERSION}` and
          # `select(.tag_name == "v${VERSION}")` fail to find the draft.
          # We MUST go straight to the release id.
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No RELEASE_ID was passed in from the create-or-find step"
            exit 1
          fi

          echo "Publishing release id=${RELEASE_ID} for v${VERSION}"

          # Patch the release: set draft=false AND re-assert tag_name so that
          # GitHub binds it to the actual git tag (otherwise GitHub leaves the
          # synthetic "untagged-XXX" tag on the published release).
          if gh api \
              -X PATCH \
              "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              -f tag_name="v${VERSION}" \
              -f name="v${VERSION}" \
              -F draft=false; then
            echo "Published release v${VERSION} (id=${RELEASE_ID})"
            exit 0
          fi

          echo "::error::Failed to publish release v${VERSION} (id=${RELEASE_ID})"
          echo "Current state of release id=${RELEASE_ID}:"
          gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            --jq '{id, tag_name, draft, name}' || true
          echo "Token scope check (whoami):"
          gh api user --jq '.login' || true
          exit 1

      # Announce the version to desktop clients only after both the immutable R2
      # files and the GitHub Release are live. A failed draft publication must
      # never advance the production updater pointer.
      - name: Promote and verify desktop latest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          printf '{"version":"%s","tag":"v%s"}' "$VERSION" "$VERSION" > latest.json
          aws s3 cp latest.json "s3://${R2_BUCKET}/desktop/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"
          expected=$(cat latest.json)
          url="${R2_PUBLIC_BASE_URL}/desktop/latest.json"
          for attempt in 1 2 3 4 5; do
            actual=$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "${url}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}") || true
            if [ "$actual" = "$expected" ]; then
              echo "Verified ${url}: ${actual}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public desktop pointer did not match ${expected}"
          exit 1

  # ──────────────────────────────────────────────────────────────────────────
  # Fail before publishing when the required R2 configuration is incomplete.
  # Desktop clients ship the CDN as their production update origin, so silently
  # skipping this channel would create a release they cannot discover from R2.
  # ──────────────────────────────────────────────────────────────────────────
  r2-config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check R2 configuration
        id: check
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] \
             && [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] \
             && [ "$R2_PUBLIC_BASE_URL" = "https://cdn.aino.org.in" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "R2 is configured; will publish to R2."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::R2 configuration is incomplete or R2_PUBLIC_BASE_URL is not https://cdn.aino.org.in"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Publish installers + electron-updater manifests (latest*.yml) to Cloudflare
  # R2 (S3-compatible) so the desktop auto-updater can deliver updates while the
  # GitHub repo stays PRIVATE. Keeps the newest 5 releases and prunes older ones.
  # ──────────────────────────────────────────────────────────────────────────
  publish-r2:
    needs: [validate, prepare-release, build, r2-config]
    if: needs.r2-config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Recent aws-cli v2 sends x-amz-checksum-* headers R2 can reject with 501.
      # These disable that; older aws-cli simply ignores the vars.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download installers from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p installers
          gh api --paginate "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name | startswith("checksums-") | not) | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r id name; do
                gh api -H 'Accept: application/octet-stream' \
                  "repos/${{ github.repository }}/releases/assets/${id}" > "installers/${name}"
              done
          test -n "$(find installers -maxdepth 1 -type f -print -quit)"

      - name: Upload installers to R2 (immutable, long cache)
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          DEST="s3://${R2_BUCKET}/desktop/releases/${TAG}/"
          if aws s3 ls "$DEST" --recursive --endpoint-url "$R2_ENDPOINT" | grep -q .; then
            echo "::error::Immutable release prefix ${DEST} already contains files. Publish a new patch version instead of overwriting it."
            exit 1
          fi
          echo "Uploading $(ls -1 installers | wc -l) files to ${DEST}"
          # Installers + blockmaps: versioned folder is immutable, cache forever.
          aws s3 cp installers/ "$DEST" --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.yml" --exclude "*.yaml"
          # latest*.yml: mark no-cache so a re-published same-version build (or a
          # CDN edge that cached an older manifest) is always picked up.
          aws s3 cp installers/ "$DEST" --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "text/yaml" \
            --cache-control "no-cache" \
            --exclude "*" --include "*.yml" --include "*.yaml"

      - name: Verify immutable release files are public
        run: |
          set -euo pipefail
          manifest=$(find installers -maxdepth 1 -name 'latest*.yml' -type f | head -1)
          test -n "$manifest"
          curl --fail --silent --show-error \
            "${R2_PUBLIC_BASE_URL}/desktop/releases/v${VERSION}/$(basename "$manifest")?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >/dev/null

      - name: Prune old desktop releases (keep newest 5)
        run: |
          set -euo pipefail
          current="v${VERSION}"
          all=$(aws s3 ls "s3://${R2_BUCKET}/desktop/releases/" --endpoint-url "$R2_ENDPOINT" \
                | awk '{print $2}' | sed 's#/##' | grep -E '^v[0-9]' || true)
          if [ -z "$all" ]; then echo "Nothing to prune"; exit 0; fi
          # Always retain the release this run is publishing, even when manually
          # recovering an older tag. Fill the remaining four slots with the newest
          # other versions and prune everything else.
          keep=$(printf '%s\n%s\n' "$current" \
            "$(echo "$all" | grep -vxF "$current" | sort -Vr | head -n 4)" \
            | grep -E '^v[0-9]' | sort -u)
          for r in $all; do
            if ! echo "$keep" | grep -qxF "$r"; then
              echo "Pruning desktop/releases/${r}"
              aws s3 rm "s3://${R2_BUCKET}/desktop/releases/${r}/" --recursive --endpoint-url "$R2_ENDPOINT"
            fi
          done
