name: Cloudflare Edge — Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to update production Worker routes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/package-lock.json

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is required."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Repository secret R2_ACCOUNT_ID is required for the Cloudflare account ID."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Test edge routing policy
        run: npm test

      - name: Deploy production Worker and routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npm run deploy