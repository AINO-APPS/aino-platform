name: Cloudflare Edge — Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to update production Worker routes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/package-lock.json

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is required."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Repository secret R2_ACCOUNT_ID is required for the Cloudflare account ID."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Test edge routing policy
        run: npm test

      - name: Deploy production Worker and routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify console SPA and API routing
        working-directory: .
        run: |
          set -euo pipefail
          origin="https://console.aino.org.in"

          # Cloudflare route and R2 SPA fallback must both be live. Retry briefly
          # because route propagation can lag a successful Wrangler deployment.
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "${origin}/login?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                --output /tmp/console-login.html \
                && grep -q '<div id="root"></div>' /tmp/console-login.html; then
              echo "Console SPA verified on attempt ${attempt}."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Console SPA did not become reachable after Worker deployment."
              exit 1
            fi
            sleep 5
          done

          ready=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            "${origin}/readyz?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          echo "$ready" | jq -e '.status == "ready" and .role == "web"' >/dev/null

          # An invalid login must reach Express through the console route. A
          # timeout/HTML response indicates the Worker route or API origin is
          # broken even when the static shell happens to load.
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/console-login.json \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'X-Requested-With: WorkPulse' \
            --data '{"username":"__console_route_probe__","password":"invalid"}' \
            "${origin}/api/auth/login")
          test "$status" = "401" || {
            cat /tmp/console-login.json
            echo "::error::Console login route returned HTTP ${status}, expected 401."
            exit 1
          }
          jq -e '.error == "Invalid credentials"' /tmp/console-login.json >/dev/null
          echo "Console API routing verified."

          # THE REALM CHECK. A 401 above only proves Express was reached; it does
          # not prove the server resolved the console host to the PLATFORM realm.
          # Logout is the cheapest unauthenticated probe that reveals the realm,
          # because it clears the realm's own cookie: `aino_console` on the
          # console, `token` on the app host. Seeing `token` here means the
          # browser-visible hostname never survived to Express, every console
          # request is being treated as tenant traffic, and platform login will
          # fail with 403 PLATFORM_LOGIN_HOST_REQUIRED while the SPA still loads.
          logout_cookie=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --dump-header - --output /dev/null \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Requested-With: WorkPulse' \
            --data '{}' \
            "${origin}/api/auth/logout" | grep -i '^set-cookie:' || true)
          case "$logout_cookie" in
            *aino_console=*)
              echo "Console realm verified (aino_console cookie scoped to the console host)."
              ;;
            *)
              echo "$logout_cookie"
              echo "::error::Console host did not resolve to the platform realm. The browser-visible hostname is not reaching Express — check that the Worker sets X-AINO-Forwarded-Host and that CONSOLE_HOST is set on the web service."
              exit 1
              ;;
          esac

          # The Cloudflare Browser Insights beacon POSTs to /cdn-cgi/rum. This is
          # INFORMATIONAL ONLY and must never gate the deploy.
          #
          # `/cdn-cgi/*` is reserved by Cloudflare and is answered at the edge
          # before Worker routes are evaluated, so the Worker's RUM short-circuit
          # cannot run for it and a 204 is not achievable from our code. Probing
          # the path shows no `cfWorker` entry in Server-Timing, proving the
          # Worker was never invoked. When Browser Insights is not enabled for
          # the zone the edge answers 404 (previously surfaced as 503).
          #
          # Asserting 204 here failed the workflow *after* a successful
          # `wrangler deploy`, which made a completed edge rollout look like a
          # failed one — the reason the X-AINO-Forwarded-Host fix sat undeployed
          # while platform login stayed broken with 403.
          rum_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            "${origin}/cdn-cgi/rum" || echo "000")
          case "$rum_status" in
            204|404|503)
              echo "Cloudflare RUM beacon returned HTTP ${rum_status} (cosmetic, edge-handled)."
              ;;
            *)
              echo "::warning::Cloudflare RUM beacon returned HTTP ${rum_status}."
              ;;
          esac
