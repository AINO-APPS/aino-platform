name: Bootstrap platform administrator (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type BOOTSTRAP to create the first tenantless platform administrator
        required: true
        default: ""

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ github.event.inputs.confirm == 'BOOTSTRAP' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install and build server
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Verify empty state and bootstrap
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.FRESH_BOOTSTRAP_DATABASE_URL }}
          BOOTSTRAP_PUBLIC_KEY_B64: ${{ secrets.BOOTSTRAP_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$BOOTSTRAP_PUBLIC_KEY_B64" ]; then
            echo "::error::Temporary bootstrap secrets are not configured."
            exit 1
          fi

          BEFORE=$(node - <<'NODE'
          const { Pool } = require("pg");
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          (async () => {
            try {
              const result = await pool.query(`
                SELECT
                  (SELECT COUNT(*)::int FROM platform_users) AS platform_users,
                  (SELECT COUNT(*)::int FROM tenants) AS tenants,
                  (SELECT COUNT(*)::int FROM user_directory) AS directory,
                  (SELECT COUNT(*)::int FROM user_sessions) AS sessions
              `);
              process.stdout.write(JSON.stringify(result.rows[0]));
            } finally {
              await pool.end();
            }
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE
          )
          if [ "$BEFORE" != '{"platform_users":0,"tenants":0,"directory":0,"sessions":0}' ]; then
            echo "::error::Fresh database is not empty: $BEFORE"
            exit 1
          fi
          echo "Pre-bootstrap counts: $BEFORE"

          PASSWORD="Aa1!$(openssl rand -base64 32 | tr -d '\n')"
          export PLATFORM_BOOTSTRAP_PASSWORD="$PASSWORD"
          node dist/scripts/bootstrap-platform-admin.js

          AFTER=$(node - <<'NODE'
          const { Pool } = require("pg");
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          (async () => {
            try {
              const result = await pool.query(`
                SELECT
                  (SELECT COUNT(*)::int FROM platform_users) AS platform_users,
                  (SELECT COUNT(*)::int FROM platform_users WHERE username = 'vvronline' AND role = 'platform_admin' AND is_active = TRUE AND must_change_password = TRUE) AS valid_admins,
                  (SELECT COUNT(*)::int FROM tenants) AS tenants,
                  (SELECT COUNT(*)::int FROM user_directory) AS directory,
                  (SELECT COUNT(*)::int FROM user_sessions) AS sessions
              `);
              process.stdout.write(JSON.stringify(result.rows[0]));
            } finally {
              await pool.end();
            }
          })().catch((error) => { console.error(error.message); process.exit(1); });
          NODE
          )
          if [ "$AFTER" != '{"platform_users":1,"valid_admins":1,"tenants":0,"directory":0,"sessions":0}' ]; then
            echo "::error::Post-bootstrap invariants failed: $AFTER"
            exit 1
          fi
          echo "Post-bootstrap counts: $AFTER"

          printf '%s' "$BOOTSTRAP_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/bootstrap-public.pem"
          printf '%s' "$PASSWORD" | openssl pkeyutl -encrypt -pubin \
            -inkey "$RUNNER_TEMP/bootstrap-public.pem" \
            -out "$RUNNER_TEMP/bootstrap-password.enc"
          unset PASSWORD PLATFORM_BOOTSTRAP_PASSWORD DATABASE_URL BOOTSTRAP_PUBLIC_KEY_B64
          rm -f "$RUNNER_TEMP/bootstrap-public.pem"

      - name: Upload encrypted one-time password
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-password-encrypted
          path: ${{ runner.temp }}/bootstrap-password.enc
          retention-days: 1
          if-no-files-found: error